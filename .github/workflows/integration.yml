name: Cognit integration tests

on:
  push:
    branches:
      - main
      - 'ahmed/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Python API integration and scoring tests
        env:
          ANTHROPIC_API_KEY: ''
          PYTHONPATH: .
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/runner.worker.js
